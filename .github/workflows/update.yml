name: Update G2B Sales Dashboard

on:
  workflow_dispatch:
  schedule:
    # KST 08:30 / 13:30 / 18:30
    - cron: '30 23 * * *'
    - cron: '30 4 * * *'
    - cron: '30 9 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update NaraJangteo data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOOKBACK_DAYS: '3'
        run: python update.py

      - name: Commit updated data
        run: |
          git config user.name "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update NaraJangteo sales data"
            git push
          fi
